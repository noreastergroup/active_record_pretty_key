name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        db: [sqlite3, postgresql, mysql2, trilogy]
        include:
          - db: postgresql
            database_url: postgresql://postgres:postgres@127.0.0.1:5432/pretty_key_test
          - db: mysql2
            database_url: mysql2://root:root@127.0.0.1:3306/pretty_key_test
          - db: trilogy
            database_url: trilogy://root:root@127.0.0.1:3306/pretty_key_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pretty_key_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pretty_key_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BUNDLE_WITH: postgresql:mysql
      DB: ${{ matrix.db }}
      DATABASE_URL: ${{ matrix.database_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client library
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec
